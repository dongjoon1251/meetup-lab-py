[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meetup-lab"
version = "0.1.0"
description = "스터디 모임 운영 서비스 — 메뉴 투표 + 행사 신청·대기자 관리 (Copilot 실습용)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "tzdata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meetup_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
